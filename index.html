<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcolheMente | Portal de Apoio e Saúde Emocional</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <aside class="accessibility-bar" aria-label="Ferramentas de Acessibilidade">
        <div class="accessibility-container">
            <span><i class="fa-solid fa-universal-access"></i> Acessibilidade:</span>
            <button id="toggle-dark" title="Alternar Modo Escuro" aria-label="Alternar Modo Escuro">
                <i class="fa-solid fa-moon"></i> Modo Escuro
            </button>
            <button id="increase-font" title="Aumentar Fonte" aria-label="Aumentar Fonte">
                <i class="fa-solid fa-font"></i> A+ Texto
            </button>
            <button id="toggle-contrast" title="Alto Contraste" aria-label="Alto Contraste">
                <i class="fa-solid fa-circle-half-stroke"></i> Alto Contraste
            </button>
        </div>
    </aside>

    <header class="main-header">
        <div class="header-container">
            <a href="#home" class="logo">
                <i class="fa-solid fa-heart-pulse logo-icon"></i>
                <div class="logo-text">
                    <span class="brand-name">AcolheMente</span>
                    <span class="brand-sub">Saúde Emocional Escolar</span>
                </div>
            </a>

            <nav class="navbar" aria-label="Navegação Principal">
                <ul>
                    <li><a href="#home" class="active"><i class="fa-solid fa-house"></i> Início</a></li>
                    <li><a href="#pilares"><i class="fa-solid fa-seedling"></i> Dicas</a></li>
                    <li><a href="#escuta"><i class="fa-solid fa-comments"></i> Escuta</a></li>
                    <li><a href="#quiz"><i class="fa-solid fa-gamepad"></i> Quiz</a></li>
                    <li><a href="#referencias"><i class="fa-solid fa-book"></i> Fontes</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        
        <section
